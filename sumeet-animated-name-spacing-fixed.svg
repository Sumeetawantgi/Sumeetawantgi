<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sumeet Awantgi, AI and ML engineer, Python developer and creative technologist" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0a1a3a"/>
<stop offset="1" stop-color="#14305f"/>
</linearGradient>
<linearGradient id="rule" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#7cc4ff"/>
<stop offset="1" stop-color="#3b82f6"/>
</linearGradient>
</defs>

<rect width="1200" height="300" rx="22" fill="url(#navy)"/>
<rect x=".5" y=".5" width="1199" height="299" rx="21.5" fill="none" stroke="#9cc3ff" stroke-opacity=".18"/>

<!-- one quiet accent: a vertical rule that draws in, and a blinking full stop -->
<rect x="72" y="66" width="4" height="0" rx="2" fill="url(#rule)">
<animate attributeName="height" from="0" to="168" dur="0.9s" begin=".15s" fill="freeze"/>
</rect>

<text x="108" y="88" fill="#8fa8d4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing=".3">Hello, world. I'm</text>

<text x="104" y="180" fill="#f4f8ff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-3">Sumeet Awantgi<tspan fill="#7cc4ff">.<animate attributeName="fill-opacity" values="1;1;0;0;1" keyTimes="0;.5;.5;.9;1" dur="1.2s" begin="1s" repeatCount="indefinite"/></tspan></text>

<text x="108" y="226" fill="#dce8ff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing=".2">AI &amp; ML Engineer <tspan fill="#7cc4ff" font-weight="400">/</tspan> Python Developer</text>

<text x="108" y="256" fill="#8fa8d4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing=".2">Creative technologist, building ideas into reality.</text>
</svg>
