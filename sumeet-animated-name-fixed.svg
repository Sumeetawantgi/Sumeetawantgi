<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="SUMEET AWANTGI — AI and ML engineer, Python developer and creative technologist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b16"/><stop offset=".55" stop-color="#10132a"/><stop offset="1" stop-color="#080b16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d5ff"/><stop offset=".52" stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#7c3aed" stop-opacity=".28"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8da2ff" stroke-opacity=".075"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <ellipse cx="940" cy="70" rx="330" ry="220" fill="url(#glow)"/>
  <ellipse cx="190" cy="285" rx="280" ry="150" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="298" rx="21" fill="none" stroke="#7c8cff" stroke-opacity=".32"/>
  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".75">
    <path d="M70 54h95l18 18h70M1030 235h-70l-18-18h-90"/>
    <circle cx="70" cy="54" r="4" fill="#35d5ff"/><circle cx="1030" cy="235" r="4" fill="#d946ef"/>
  </g>
  <text x="92" y="91" fill="#a5b4fc" font-family="monospace" font-size="15" letter-spacing="4">HELLO, WORLD  //  I'M</text>

  <!-- Name remains visible even if a platform disables SVG text animations. -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" letter-spacing="1.5">
    <text x="88" y="177" fill="#f8fafc">SUMEET</text>
    <text x="370" y="177" fill="url(#accent)">AWANTGI</text>
  </g>
  <rect x="88" y="187" width="0" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" from="0" to="390" dur="1.2s" begin=".2s" fill="freeze"/>
  </rect>
  <text x="94" y="239" fill="#dbe4ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" letter-spacing="1.2">
    AI &amp; ML ENGINEER  <tspan fill="#64748b">|</tspan>  PYTHON DEVELOPER
  </text>
  <text x="94" y="266" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.1">
    CREATIVE TECHNOLOGIST  •  BUILDING IDEAS INTO REALITY
  </text>
  <g transform="translate(1010 120)" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M-36 -22L-60 0l24 22M36 -22L60 0 36 22M12 -34L-12 34"/>
    <circle r="82" stroke="#8b5cf6" stroke-opacity=".18" stroke-width="1.5"/>
    <circle r="100" stroke="#35d5ff" stroke-opacity=".12" stroke-width="1" stroke-dasharray="5 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#c4b5fd">
    <circle cx="760" cy="54" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="255" r="2"><animate attributeName="opacity" values="1;.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="62" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
