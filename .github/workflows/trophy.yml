name: Generate GitHub Trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Trophy SVG
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=Sumeetawantgi&theme=tokyonight&column=7&no-frame=true"
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Trophy SVG
        run: |
          git clone https://github.com/${{ github.repository }} repo
          cd repo
          mkdir -p profile
          cp ../profile/trophy.svg profile/trophy.svg
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile/trophy.svg
          git commit -m "Update GitHub trophies" || exit 0
          git push
